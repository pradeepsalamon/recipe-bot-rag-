[project]
name = "pantry-to-plate"
version = "0.1.0"
requires-python = ">=3.11"
# Vercel installs from this file when it exists (requirements.txt is then
# ignored), so the runtime dependencies must be listed here. Keep in sync
# with requirements.txt, which local `pip install -r` setups still use.
# No torch / sentence-transformers: embeddings run on chromadb's ONNX build of
# the same model (pantry/retriever.py), keeping the bundle under Vercel's 500 MB.
dependencies = [
    "python-dotenv==1.2.3",
    "groq==0.37.1",
    "mcp==2.2.0",
    "chromadb==1.5.9",
    "langchain-chroma==1.1.0",
    "langchain-core==1.6.4",
    "rank-bm25==0.2.2",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "langsmith==0.14.0",
]
