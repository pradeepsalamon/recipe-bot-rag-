[project]
name = "pantry-to-plate"
version = "0.1.0"
requires-python = ">=3.11"
# Vercel installs from this file when it exists (requirements.txt is then
# ignored), so the runtime dependencies must be listed here. Keep in sync
# with requirements.txt, which local `pip install -r` setups still use.
dependencies = [
    "torch==2.14.0",              # CPU wheel via the index below: the CUDA build is far too large
    "python-dotenv==1.2.3",
    "groq==0.37.1",
    "mcp==2.2.0",
    "chromadb==1.5.9",
    "langchain-chroma==1.1.0",
    "langchain-huggingface==1.2.2",
    "langchain-core==1.6.4",
    "sentence-transformers==6.1.0",
    "rank-bm25==0.2.2",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "langsmith==0.14.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
